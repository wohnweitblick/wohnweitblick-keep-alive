name: Keep WohnWeitblick awake

on:
  schedule:
    # Alle 5 Minuten für ausreichenden Puffer vor dem Render-Ruhezustand.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wohnweitblick-keep-alive
  cancel-in-progress: true

jobs:
  keep-alive:
    name: Wake Render and check domain
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Wake Render service
        shell: bash
        run: |
          set -euo pipefail

          curl \
            --request GET \
            --fail \
            --location \
            --silent \
            --show-error \
            --connect-timeout 20 \
            --max-time 120 \
            --retry 4 \
            --retry-delay 10 \
            --retry-all-errors \
            --header "Cache-Control: no-cache" \
            --header "User-Agent: WohnWeitblick-KeepAlive/1.0" \
            --output /dev/null \
            --write-out "Render HTTP-Status: %{http_code}\nRender Gesamtzeit: %{time_total}s\n" \
            "https://wohnweitblick-staging.onrender.com/"

      - name: Check public domain
        shell: bash
        run: |
          set -euo pipefail

          curl \
            --request GET \
            --fail \
            --location \
            --silent \
            --show-error \
            --connect-timeout 20 \
            --max-time 120 \
            --retry 3 \
            --retry-delay 10 \
            --retry-all-errors \
            --header "Cache-Control: no-cache" \
            --header "User-Agent: WohnWeitblick-KeepAlive/1.0" \
            --output /dev/null \
            --write-out "Domain HTTP-Status: %{http_code}\nDomain Gesamtzeit: %{time_total}s\n" \
            "https://wohnweitblick.de/"
